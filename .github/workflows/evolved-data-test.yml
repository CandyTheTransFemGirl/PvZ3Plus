name: Evolved data connectivity test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/evolved-data-test.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public live configuration endpoint
        run: |
          mkdir -p report
          curl --proto '=https' --connect-timeout 10 --max-time 30 --silent --show-error --output /tmp/almanac.data --write-out 'HTTP %{http_code}; bytes %{size_download}\n' 'https://pvzn3xt.ak.popcap.com/game-data/binary/36.0.95/AlmanacConfig-73c28fb527fb2c2b81a2c3954028f4db.data' > report/status.txt 2>&1 || true
          cat report/status.txt
          if test -f /tmp/almanac.data; then sha256sum /tmp/almanac.data >> report/status.txt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: evolved-connectivity-report
          path: report/
          retention-days: 3
