name: Index Almanac animations
on:
  workflow_dispatch:
  push:
    paths:
      - 'animations/**'
      - 'assets/**/*.gif'
      - 'assets/**/*.GIF'
      - '*.gif'
      - '*.GIF'
      - '.github/workflows/animation-index.yml'
permissions:
  contents: write
concurrency:
  group: animation-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python - <<'PY'
          import re,json
          from pathlib import Path
          from urllib.parse import quote
          folder=Path('animations')
          folder.mkdir(exist_ok=True)
          for source in sorted(Path('.').iterdir()):
              if not source.is_file() or source.suffix.lower()!='.gif': continue
              dest=folder/source.name
              if dest.exists():
                  if source.read_bytes()==dest.read_bytes():
                      source.unlink()
                      print('Removed identical root duplicate:',source)
                  else:
                      print('Filename conflict; preserved both:',source)
              else:
                  source.rename(dest)
                  print('Moved:',source,'to',dest)
          mapping={}
          ranks={}
          for p in sorted(Path('animations').iterdir())+sorted(Path('assets').rglob('*')):
              if not p.is_file() or p.suffix.lower()!='.gif': continue
              s=p.stem.lower()
              s=re.sub(r'[_ -]ee$','',s)
              s=re.sub(r'\((?:plant|zombie|almanac|\d+)\)','',s)
              s=re.sub(r'(?:[_ -]+(?:idle|walk|walking|animation|anim|almanac))+$','',s)
              key=re.sub('[^a-z0-9]','',s)
              if not key: continue
              rank=30 if 'almanac' in p.stem.lower() else 20 if 'idle' in p.stem.lower() else 10 if 'walk' in p.stem.lower() else 0
              if p.stem.lower()==key: rank+=1
              if key not in ranks or rank>ranks[key]:
                  mapping[key]='./'+quote(p.as_posix(),safe='/')
                  ranks[key]=rank
          Path('animations.json').write_text(json.dumps(mapping,indent=2,sort_keys=True)+'\n')
          print(json.dumps(mapping,indent=2))
          PY
      - run: |
          git config user.name "PvZ3+ Animation Index"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- animations/ animations.json
          git ls-files -z --deleted | while IFS= read -r -d '' file; do
            case "$file" in
              */*) ;;
              *.[gG][iI][fF]) git add -u -- "$file" ;;
            esac
          done
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Almanac animation index"
          git pull --rebase origin main
          git push origin HEAD:main
