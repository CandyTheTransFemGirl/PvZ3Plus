name: Install restored v50 artwork
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-v50.yml'
      - 'PvZ3Plus_v50_assets.zip'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow
      - name: Validate and install actual artwork
        run: |
          python - <<'PY'
          import zipfile, pathlib, re, io
          from PIL import Image
          with zipfile.ZipFile('PvZ3Plus_v50_assets.zip') as z:
              html=z.read('PvZ3Plus_Almanac_v50.html').decode('utf-8')
              assets=[n for n in z.namelist() if n.startswith('assets/') and not n.endswith('/')]
              assert len(assets)==239, len(assets)
              for n in assets:
                  p=pathlib.Path(n)
                  assert len(p.parts)==2 and '..' not in p.parts
                  b=z.read(n)
                  with Image.open(io.BytesIO(b)) as im:
                      im.verify()
                  with Image.open(io.BytesIO(b)) as im:
                      im.load()
                  p.parent.mkdir(exist_ok=True)
                  p.write_bytes(b)
              for n in re.findall(r'assets/[A-Za-z0-9_.-]+\.(?:png|jpg|jpeg|webp|gif)',html):
                  assert pathlib.Path(n).is_file(), n
              pathlib.Path('index.html').write_text(html,encoding='utf-8')
              print('Validated and installed',len(assets),'images')
          PY
      - name: Commit restored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if ! git diff --cached --quiet; then
            git commit -m "Install validated v50 artwork and live Almanac"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
