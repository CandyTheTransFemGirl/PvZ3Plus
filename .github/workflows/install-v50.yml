name: Install restored v50 artwork
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-v50.yml'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow
      - run: |
          python - <<'PY'
          import zipfile, pathlib, io, re, struct, zlib
          from PIL import Image
          with zipfile.ZipFile('PvZ3Plus_v50_assets.zip') as z:
              html=z.read('PvZ3Plus_Almanac_v50.html').decode()
              for n in z.namelist():
                  if not n.startswith('assets/') or n.endswith('/'): continue
                  b=z.read(n)
                  if b.startswith(b'\x89PNG\r\n\x1a\n'):
                      out=bytearray(b[:8]); pos=8
                      while pos<len(b):
                          size=struct.unpack_from('>I',b,pos)[0]
                          chunk=b[pos+4:pos+8+size]
                          assert len(chunk)==size+4
                          out.extend(b[pos:pos+8+size])
                          out.extend(struct.pack('>I',zlib.crc32(chunk)&0xffffffff))
                          pos+=12+size
                      b=bytes(out)
                  with Image.open(io.BytesIO(b)) as im: im.verify()
                  with Image.open(io.BytesIO(b)) as im: im.load()
                  p=pathlib.Path(n); p.parent.mkdir(exist_ok=True); p.write_bytes(b)
              for n in re.findall(r'assets/[A-Za-z0-9_.-]+\.(?:png|jpg|jpeg|webp|gif)',html):
                  assert pathlib.Path(n).is_file(),n
              pathlib.Path('index.html').write_text(html)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if ! git diff --cached --quiet; then
            git commit -m "Install restored artwork"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
