const oldDrawActivities=drawActivities;drawActivities=function(){oldDrawActivities();const feed=document.getElementById('activityFeed');if(socialMode!=='events'||!feed||feed.querySelector('#eventTemplates'))return;const box=el('section');box.id='eventTemplates';box.append(el('h3','Event templates'));const pick=el('select');const templates=[['dave',"Crazy Dave’s Tasks",3],['patrice',"Patrice’s Plant Missions",7],['chaos','Cards of Chaos',7],['disco','Disco Dance Marathon',7],['patrol','Lawn Patrol',7],['pass','Plant Pass',14],['watch','Neighborville Watch',7]];for(const t of templates)pick.add(new Option(t[1],t[0]));const title=el('input');const start=el('input');start.type='datetime-local';const end=el('input');end.type='datetime-local';function preset(){const t=templates.find(t=>t[0]===pick.value);title.value=t[1];start.value=new Date().toISOString().slice(0,16);end.value=new Date(Date.now()+t[2]*86400000).toISOString().slice(0,16)}pick.onchange=preset;preset();const publish=el('button','Create event from template');const msg=el('p');publish.onclick=async()=>{try{const st=new Date(start.value+'Z').toISOString(),en=new Date(end.value+'Z').toISOString();if(!title.value.trim()||en<=st)throw Error('Invalid event dates or title');await mutateSave(v=>{const id=newMessageId();v.activities??={};(v.activities.events??=[]).push({id,title:title.value.trim(),description:'',startAt:st,endAt:en,template:pick.value,rewards:{},otherReward:''});v.eventContent??={};v.eventContent[id]={quests:[],shop:[],rewardTrack:[],rewardClaims:[],points:0,balance:0};});msg.textContent='Event created'}catch(e){msg.textContent=e.message}};box.append(pick,el('label','Event title'),title,el('label','Start GMT'),start,el('label','End GMT'),end,publish,msg);feed.prepend(box)};
