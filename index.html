let pushPolling=false,pushCursor=null;
async function pollDataPushes(){
 if(pushPolling||!ownerCredential||!data)return;pushPolling=true;
 try{
 const headers={Authorization:'Bearer '+ownerCredential,Accept:'application/vnd.github+json'};
 const base='https://api.github.com/repos/CandyTheTransFemGirl/PvZ3Plus';
 const r=await fetch(base+'/commits?sha=main&per_page=30',{headers,cache:'no-store'});if(!r.ok)return;
 const commits=await r.json();const group=data.groups?.list?.find(g=>g.id==='dataminer-group');if(!group)return;
 const seen=new Set(group.dataPushes?.seen||[]);const pending=commits.filter(c=>!seen.has(c.sha)&&!/^Update PvZ3Plus social data|^Append private fictional dataminer discovery|^Dataminer/i.test(c.commit.message)).reverse();
 const batch=pending.slice(-12);if(!batch.length)return;
 const pushes=[];
 for(const c of batch){const rr=await fetch(base+'/commits/'+c.sha,{headers,cache:'no-store'});if(!rr.ok)continue;const detail=await rr.json();const files=(detail.files||[]).filter(f=>!/^\.github\/|^scripts\//.test(f.filename));if(!files.length)continue;const clues=[];
 for(const f of files){if(!/(?:Loc\.json|LocalisedStringsPvZ3Plus\.Json|PeopleLocalisationPvz3Plus\.Json)$/i.test(f.filename))continue;for(const line of (f.patch||'').split('\n')){const m=line.match(/^\+\s*"(ID_[^"]+)"\s*:\s*("(?:[^"\\]|\\.)*")/);if(m)try{clues.push({key:m[1],value:JSON.parse(m[2]),file:f.filename});}catch{}}}
 pushes.push({sha:c.sha,at:c.commit.author.date,files:files.map(f=>f.filename),clues});}
 if(!pushes.length)return;
 await mutateSave(v=>{const g=v.groups.list.find(x=>x.id==='dataminer-group');const state=g.dataPushes??={seen:[],queue:[]};for(const p of pushes){if(state.seen.includes(p.sha))continue;state.seen.push(p.sha);state.queue.push(p);const m=g.members.find(x=>x.id==='generated-4-1')||g.members[0];if(!g.messages.some(x=>x.id?.startsWith('data-push-')&&x.body.includes(p.files.join(', ')+'.')&&Date.now()-Date.parse(x.createdAt)<30000))g.messages.push({id:'data-push-'+p.sha,senderId:m.id,sender:m.name,body:'Data Push detected: '+p.files.join(', ')+'. Checking what changed.',createdAt:new Date().toISOString(),replyTo:null});}state.seen=state.seen.slice(-300);},true);
 }catch(e){console.warn('Data Push monitor:',e.message);}finally{pushPolling=false;}
